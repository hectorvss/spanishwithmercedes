<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El cazador de tildes · Spanish Lessons with Mercedes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#7B1D1D; --red-live:#B22222; --gold:#D4A017; --navy:#1B2A4B;
  --green:#36815A; --cream:#FFFAED; --paper:#FFFFFF; --line:#E4DCC8;
  --text:#2C2C2C; --muted:#666666; --tile:#F5F0E5; --tile-text:#1B2A4B;
  --ok-bg:#E8F3EC; --ko-bg:#FBE9E9; --shadow:0 2px 0 rgba(27,42,75,.18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --cream:#141B2D; --paper:#1C2540; --line:#2E3A5C; --text:#ECE7DA; --muted:#A8A9B4;
    --tile:#26314F; --tile-text:#F3EBD6; --ok-bg:#183428; --ko-bg:#3A1C1C; --green:#5DB585; --red-live:#E26363;
    --shadow:0 2px 0 rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--text);font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;line-height:1.5;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 40px}
header.brand{display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
header.brand img{width:62px;height:auto}
header.brand .t1{font-weight:700;color:var(--navy);letter-spacing:.02em}
@media (prefers-color-scheme: dark){header.brand .t1{color:var(--gold)} header.brand img{background:#fff;border-radius:50%;padding:3px}}
header.brand .t2{font-style:italic;color:var(--muted);font-size:.9rem}
.display{font-family:Rubik,Arial,sans-serif}
h1{font-family:Rubik,Arial,sans-serif;font-weight:800;color:var(--red);font-size:clamp(2rem,6vw,2.8rem);line-height:1.1;margin:28px 0 8px}
@media (prefers-color-scheme: dark){h1{color:var(--gold)}}
.lead{font-size:1.05rem;max-width:60ch;margin:0 0 6px}
.en{color:var(--muted);font-size:.9rem;font-style:italic}
/* hero: la palabra que crece */
.hero-word{display:flex;gap:6px;flex-wrap:wrap;margin:24px 0 8px}
.tile{font-family:Rubik,Arial,sans-serif;font-weight:700;font-size:clamp(1.4rem,5vw,2rem);min-width:64px;padding:12px 16px;border-radius:10px;
  background:var(--tile);color:var(--tile-text);border:2px solid transparent;box-shadow:var(--shadow);text-align:center;text-transform:lowercase}
.tile.tonic{background:var(--gold);color:var(--navy)}
.tile.grow{animation:grow .5s ease-out both}
@keyframes grow{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.levels{display:grid;gap:12px;margin:26px 0}
.level-card{display:flex;gap:16px;align-items:flex-start;background:var(--paper);border-left:6px solid var(--red);padding:14px 16px;border-radius:0 10px 10px 0}
.level-card .n{font-family:Rubik,Arial,sans-serif;font-weight:800;font-size:1.6rem;color:var(--gold);line-height:1}
.level-card b{color:var(--navy)}
@media (prefers-color-scheme: dark){.level-card b{color:var(--text)}}
button{font:inherit;cursor:pointer}
.btn{font-family:Rubik,Arial,sans-serif;font-weight:700;font-size:1.05rem;border:0;border-radius:10px;padding:14px 26px;background:var(--red);color:#fff;box-shadow:0 3px 0 #4d1010}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #4d1010}
.btn.ghost{background:transparent;color:var(--red);box-shadow:none;border:2px solid var(--red)}
@media (prefers-color-scheme: dark){.btn.ghost{color:var(--gold);border-color:var(--gold)}}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
/* juego */
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 10px;font-size:.95rem;color:var(--muted)}
.hud strong{color:var(--text)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--gold);width:0;transition:width .35s}
.stage-title{font-family:Rubik,Arial,sans-serif;font-weight:700;color:var(--navy);font-size:1.3rem;margin:22px 0 2px}
@media (prefers-color-scheme: dark){.stage-title{color:var(--gold)}}
.prompt{margin:0 0 18px}
.board{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:24px 0}
.board .tile{cursor:pointer;transition:transform .12s}
.board .tile:hover:not([disabled]){transform:translateY(-3px)}
.board .tile[disabled]{cursor:default}
.tile.ok{background:var(--gold);color:var(--navy);border-color:var(--green)}
.tile.ko{background:var(--ko-bg);color:var(--red-live);border-color:var(--red-live)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}
.choice{font-family:Rubik,Arial,sans-serif;font-weight:700;font-size:clamp(1.3rem,5vw,1.8rem);padding:22px 10px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--text);box-shadow:var(--shadow)}
.choice:hover:not([disabled]){border-color:var(--gold)}
.choice.ok{border-color:var(--green);background:var(--ok-bg);color:var(--green)}
.choice.ko{border-color:var(--red-live);background:var(--ko-bg);color:var(--red-live);text-decoration:line-through}
.singular{text-align:center;font-family:Rubik,Arial,sans-serif;font-size:1.1rem;margin-top:18px}
.singular b{font-size:2rem;display:block;color:var(--navy)}
@media (prefers-color-scheme: dark){.singular b{color:var(--text)}}
.sentence{display:flex;flex-wrap:wrap;gap:6px 6px;justify-content:center;margin:26px 0;font-size:clamp(1.15rem,4.2vw,1.45rem)}
.w{border:0;background:transparent;color:var(--text);padding:6px 8px;border-radius:8px;border-bottom:2px dashed var(--line)}
.w:hover:not([disabled]){background:var(--tile)}
.w[disabled]{cursor:default}
.w.ok{background:var(--ok-bg);color:var(--green);font-weight:700;border-bottom-color:var(--green)}
.w.ko{background:var(--ko-bg);color:var(--red-live);text-decoration:line-through;border-bottom-color:var(--red-live)}
.feedback{border-left:6px solid var(--green);background:var(--paper);padding:14px 16px;border-radius:0 10px 10px 0;margin:6px 0 18px}
.feedback.bad{border-left-color:var(--red-live)}
.feedback .head{font-family:Rubik,Arial,sans-serif;font-weight:700;font-size:1.1rem;margin-bottom:4px}
.feedback.good .head{color:var(--green)}
.feedback.bad .head{color:var(--red-live)}
.feedback .answer{font-family:Rubik,Arial,sans-serif;font-weight:700;color:var(--green);font-size:1.2rem}
.next-row{display:flex;justify-content:flex-end}
.streak{color:var(--red-live);font-weight:700}
/* final */
.result{text-align:center;padding:26px 0}
.big{font-family:Rubik,Arial,sans-serif;font-weight:800;font-size:clamp(3.5rem,14vw,5.5rem);color:var(--red);line-height:1}
@media (prefers-color-scheme: dark){.big{color:var(--gold)}}
.stars{font-size:2.2rem;letter-spacing:6px;color:var(--gold);margin:8px 0}
.breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.breakdown div{background:var(--paper);border-radius:10px;padding:12px 8px;border-top:4px solid var(--navy)}
.breakdown b{display:block;font-family:Rubik,Arial,sans-serif;font-size:1.4rem}
.rules{text-align:left;background:var(--paper);border-left:6px solid var(--gold);padding:14px 18px;border-radius:0 10px 10px 0;margin:20px 0}
.rules p{margin:6px 0}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
footer{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);text-align:center;font-style:italic;color:var(--muted);font-size:.85rem}
footer a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:480px){.choices{grid-template-columns:1fr}.breakdown{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function typeOf(n, t) { return TYPES[Math.min(n - 1 - t, 3)]; }
function ruleText(word, type) {
  const last = word.normalize('NFD').replace(/[\u0300-\u036f]/g, '').slice(-1);
  const vns = /[aeiouns]/.test(last);
  const end = /[aeiou]/.test(last) ? 'vocal' : '-' + last.toUpperCase();
  if (type === 'aguda') return vns
    ? `Es <b>aguda</b> y termina en ${end} → <b>lleva tilde</b>.`
    : `Es <b>aguda</b> y termina en ${end} (no en vocal, -N ni -S) → <b>sin tilde</b>.`;

    ? `Es <b>llana</b> y termina en ${end} → <b>sin tilde</b>.`
    : `Es <b>llana</b> y termina en ${end} (no en vocal, -N ni -S) → <b>lleva tilde</b>.`;
  return `Es <b>${type}</b> → las ${type}s <b>siempre llevan tilde</b>.`;

  $app.innerHTML = `
    <h1>El cazador de tildes</h1>
    <p class="lead">¿Por qué <b>examen</b> no lleva tilde y <b>exámenes</b> sí? Aquí lo vas a entrenar hasta que no tengas que pensarlo.</p>
    <p class="en">Why does «examen» have no accent mark, but «exámenes» does? Practise until it comes naturally.</p>
    <div class="hero-word" aria-hidden="true" id="heroWord"></div>
    <p class="en" style="margin-top:0">La fuerza no se mueve: la palabra crece. · The stress stays put: the word grows.</p>
    <div class="levels">
      ${LEVEL_INFO.map((l, i) => `<div class="level-card"><div class="n">${i + 1}</div><div><b>${l.title.split('· ')[1]}</b><br>${l.p}<br><span class="en">${l.en}</span></div></div>`).join('')}
    </div>
    <button class="btn" id="start">Empezar · Start</button>`;
  // pequeña animación: e-XA-men → e-XÁ-me-nes
  const hw = document.getElementById('heroWord');
  hw.innerHTML = tiles(['e', 'xa', 'men'], 1);
  setTimeout(() => {
    hw.innerHTML = `<span class="tile">e</span><span class="tile tonic">xá</span><span class="tile">me</span><span class="tile grow">nes</span>`;
  }, 1400);
  document.getElementById('start').onclick = () => { newGame(); render(); };
}

function hud() {
  const done = S.lv * PER_LEVEL + S.q;
  const score = S.levels.reduce((a, l) => a + l.score, 0);
  return `<div class="hud"><span>${LEVEL_INFO[S.lv].title.split(' · ')[0]} · Pregunta <strong>${S.q + 1}</strong>/${PER_LEVEL}</span>
    <span>Puntos <strong>${score}</strong>${S.streak >= 3 ? ` · <span class="streak">Racha ×${S.streak}</span>` : ''}</span></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${TOTAL}" aria-valuenow="${done}"><span style="width:${done / TOTAL * 100}%"></span></div>
    <div class="stage-title">${LEVEL_INFO[S.lv].title.split(' · ')[1]}</div>
    <p class="prompt">${LEVEL_INFO[S.lv].p} <span class="en">${LEVEL_INFO[S.lv].en}</span></p>`;
}

function render() {
  S.answered = false;
  const item = S.levels[S.lv].items[S.q];
  if (S.lv === 0) renderL1(item);
  else if (S.lv === 1) renderL2(item);
  else renderL3(item);
}

function mark(correct) {
  if (correct) { S.levels[S.lv].score++; S.streak++; S.best = Math.max(S.best, S.streak); } else S.streak = 0;
  S.answered = true;
}
function feedbackHTML(correct, body) {
  const heads = correct ? ['¡Muy bien!', '¡Exacto!', '¡Perfecto!', '¡Eso es!'] : ['Casi…', 'No exactamente', 'Fíjate bien'];
  const h = heads[Math.floor(Math.random() * heads.length)];
  const last = S.lv === 2 && S.q === PER_LEVEL - 1;
  const endLv = S.q === PER_LEVEL - 1;
  return `<div class="feedback ${correct ? 'good' : 'bad'}"><div class="head">${h}</div>${body}</div>
    <div class="next-row"><button class="btn" id="next">${last ? 'Ver resultado' : endLv ? 'Siguiente nivel' : 'Siguiente'}</button></div>`;
}
function bindNext() {
  const b = document.getElementById('next'); b.focus();
  b.onclick = () => {
    if (S.q < PER_LEVEL - 1) S.q++;
    else if (S.lv < 2) { S.lv++; S.q = 0; }
    else return result();
    render();
  };
}

function renderL1(it) {
  $app.innerHTML = hud() + `<div class="board">${it.s.map((x, k) => `<button class="tile" data-k="${k}" aria-label="sílaba ${x}">${esc(x)}</button>`).join('')}</div>
    <p class="en" style="text-align:center">${esc(it.en)}</p><div id="fb"></div>`;
  $app.querySelectorAll('.board .tile').forEach(b => b.onclick = () => {
    if (S.answered) return;
    const k = +b.dataset.k, ok = k === it.t;
    mark(ok);
    $app.querySelectorAll('.board .tile').forEach(x => x.disabled = true);
    b.classList.add(ok ? 'ok' : 'ko');
    if (!ok) $app.querySelector(`.board .tile[data-k="${it.t}"]`).classList.add('ok');
    const type = typeOf(it.s.length, it.t);
    const shown = it.s.map((x, i) => i === it.t ? x.toUpperCase() : x).join('-');
    document.getElementById('fb').innerHTML = feedbackHTML(ok,
      `<p style="margin:4px 0">Se dice <b>${esc(shown)}</b>. ${ruleText(it.w, type)}</p><div class="answer">${esc(it.w)}</div>`);
    bindNext();
  });
}

function renderL2(it) {
  const opts = shuffle([it.ok, it.ko]);
  $app.innerHTML = hud() + `<div class="singular">Singular<b>${esc(it.sg)}</b></div>
    <div class="choices">${opts.map(o => `<button class="choice" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="fb"></div>`;
  $app.querySelectorAll('.choice').forEach(b => b.onclick = () => {
    if (S.answered) return;
    const ok = b.dataset.v === it.ok;
    mark(ok);
    $app.querySelectorAll('.choice').forEach(x => { x.disabled = true; if (x.dataset.v === it.ok) x.classList.add('ok'); });
    if (!ok) b.classList.add('ko');
    const why = {
      gana: `<b>${esc(it.sg)}</b> es llana y termina en -N: sin tilde. En plural la fuerza sigue en el mismo sitio, pero la palabra tiene una sílaba más: ahora es <b>esdrújula</b> → siempre tilde.`,
      pierde: `<b>${esc(it.sg)}</b> es aguda y termina en -N o -S: lleva tilde. En plural la fuerza queda en la penúltima: es <b>llana terminada en -S</b> → sin tilde.`,
      excepcion: `¡Excepción! En el plural de <b>carácter</b> la fuerza se mueve: ca-RÁC-ter → ca-rac-TE-res. Es llana terminada en -S → sin tilde.`,
    }[it.k];
    document.getElementById('fb').innerHTML = feedbackHTML(ok,
      `<div class="hero-word" style="margin:8px 0">${tiles(it.ps, it.pt)}</div><p style="margin:4px 0">${why}</p>`);
    bindNext();
  });
}

function renderL3(it) {
  const words = it.f.split(' ');
  $app.innerHTML = hud() + `<div class="sentence">${words.map((w, k) => `<button class="w" data-k="${k}">${esc(w)}</button>`).join('')}</div><div id="fb"></div>`;
  $app.querySelectorAll('.w').forEach(b => b.onclick = () => {
    if (S.answered) return;
    const k = +b.dataset.k, ok = k === it.i;
    mark(ok);
    $app.querySelectorAll('.w').forEach(x => x.disabled = true);
    const wrong = $app.querySelector(`.w[data-k="${it.i}"]`);
    wrong.classList.add('ko');
    if (!ok) b.style.outline = '2px solid var(--line)';
    const fixed = words.map((w, j) => j === it.i ? `<b style="color:var(--green)">${esc(w.replace(/[\p{L}]+/u, it.c))}</b>` : esc(w)).join(' ');
    document.getElementById('fb').innerHTML = feedbackHTML(ok,
      `<p style="margin:4px 0">${ok ? 'Has cazado el error.' : `El error estaba en <b>${esc(words[it.i].replace(/[^\p{L}]/gu, ''))}</b>.`} Lo correcto es:</p><p style="margin:4px 0;font-size:1.1rem">${fixed}</p>`);
    bindNext();
  });
}

function result() {
  const sc = S.levels.map(l => l.score), total = sc.reduce((a, b) => a + b, 0);
  const stars = total >= 22 ? 3 : total >= 16 ? 2 : total >= 10 ? 1 : 0;
  const msg = stars === 3 ? '¡Eres un auténtico cazador de tildes!' : stars === 2 ? '¡Muy buen trabajo! Repasa los fallos y vuelve a intentarlo.' : stars === 1 ? 'Vas por buen camino. Repasa las tres reglas y juega otra vez.' : 'Empieza por las reglas de abajo y vuelve a jugar: verás cómo mejoras.';
  $app.innerHTML = `<div class="result">
    <div class="big">${total}/${TOTAL}</div>
    <div class="stars" aria-label="${stars} de 3 estrellas">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
    <p class="lead" style="margin:0 auto">${msg}</p>
    <div class="breakdown">
      <div>Encuentra la fuerza<b>${sc[0]}/${PER_LEVEL}</b></div>
      <div>¿Gana o pierde?<b>${sc[1]}/${PER_LEVEL}</b></div>
      <div>Caza el error<b>${sc[2]}/${PER_LEVEL}</b></div>
    </div>
    <p class="en">Mejor racha · Best streak: ${S.best}</p>
    <div class="rules">
      <p><b>Agudas</b> (fuerza en la última): tilde si terminan en vocal, -N o -S → café, canción.</p>
      <p><b>Llanas</b> (fuerza en la penúltima): tilde si NO terminan en vocal, -N o -S → árbol, lápiz.</p>
      <p><b>Esdrújulas</b> (fuerza en la antepenúltima): siempre → música, exámenes.</p>
    </div>
    <div class="actions"><button class="btn" id="again">Jugar otra vez</button>
    <a class="btn ghost" style="text-decoration:none" href="https://www.youtube.com/@spanishwithmercedes" target="_blank" rel="noopener">Ver el vídeo</a></div>
  </div>`;
  document.getElementById('again').onclick = () => { newGame(); render(); };
  document.getElementById('again').focus();
}

home();
</script>
</body>
</html>
